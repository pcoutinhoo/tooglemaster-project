name: auth-service CI/CD

on:
  push:
    branches: [develop, main]
    paths: ['auth-service/**']
  pull_request:
    branches: [develop, main]
    paths: ['auth-service/**']

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/auth-service
  SERVICE_DIR: auth-service

jobs:
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Cada job roda em um runner separado,
      # então as dependências precisam ser resolvidas novamente.
      - name: Download dependencies
        run: go mod tidy

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: golangci-lint-src-${{ runner.os }}

      # golangci-lint-action baixa um binario pre-compilado, que ainda nao
      # existe compilado com a versao de Go exigida por este modulo (pgx v5.9+
      # requer Go 1.25). Compilando na hora, com go install, o toolchain local
      # (GOTOOLCHAIN=auto) baixa e usa a versao certa sozinho.
      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

  security:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          exit-code: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod tidy

      - name: Build (garante que os pacotes estão resolvidos para o gosec)
        run: go build ./...

      - name: gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high ./...

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/develop'

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=v1.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} \
            ${{ env.SERVICE_DIR }}

      - name: Trivy image scan (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          exit-code: 1

      - name: Push to ECR
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

  update-gitops:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Clone GitOps repository
        run: |
          git clone -b develop https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/pcoutinhoo/togglemaster-gitops.git

      - name: Update image tag
        run: |
          cd togglemaster-gitops

          sed -i \
            "s|auth-service:.*|auth-service:${{ needs.build-and-push.outputs.image_tag }}|g" \
            k8s/auth-service.yaml

          git config user.email "ci@togglemaster.com"
          git config user.name "GitHub Actions CI"

          git add k8s/auth-service.yaml

          git commit \
            -m "ci: atualiza auth-service para tag ${{ needs.build-and-push.outputs.image_tag }}" \
            || echo "sem mudancas"

          git push