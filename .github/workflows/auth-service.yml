name: auth-service CI/CD

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service.yml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/auth-service
  SERVICE_DIR: auth-service

jobs:
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: go mod tidy
      - run: go test ./... -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: go mod tidy
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ env.SERVICE_DIR }}
          version: v2.12
          args: --timeout=5m
          skip-cache: true

  security-sca:
    name: Security Scan - SCA (Trivy fs)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          exit-code: 1

  security-sast:
    name: Security Scan - SAST (gosec)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -severity high ./...

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security-sca, security-sast]
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: github.ref == 'refs/heads/main'
        id: ecr-login

      - name: Define immutable ECR image URI
        if: github.ref == 'refs/heads/main'
        id: image
        run: echo "uri=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} ${{ env.SERVICE_DIR }}

      - name: Trivy image scan (container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          exit-code: 1

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} "${{ steps.image.outputs.uri }}"
          docker push "${{ steps.image.outputs.uri }}"

  update-gitops:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - run: git clone -b develop https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/pcoutinhoo/togglemaster-gitops.git
      - run: |
          cd togglemaster-gitops
          sed -i -E "s|^([[:space:]]*image: ).*togglemaster/auth-service:.*|\1${{ needs.build-and-push.outputs.image_uri }}|" k8s/auth-service.yaml
          git config user.email "ci@togglemaster.com"
          git config user.name "GitHub Actions CI"
          git add k8s/auth-service.yaml
          git commit -m "ci: atualiza auth-service para tag ${{ needs.build-and-push.outputs.image_tag }}" || echo "sem mudancas"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin develop && git push origin develop; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true

            if [ "$attempt" -eq 5 ]; then
              echo "Falha ao atualizar GitOps após 5 tentativas."
              exit 1
            fi

            sleep $((attempt * 2))
          done