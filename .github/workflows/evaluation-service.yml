name: evaluation-service CI/CD

on:
  push:
    branches: [develop, main]
    paths: ['evaluation-service/**']
  pull_request:
    branches: [develop, main]
    paths: ['evaluation-service/**']

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/evaluation-service
  SERVICE_DIR: evaluation-service

jobs:
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - run: go mod tidy

      - run: go test ./... -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Corrige o problema do go.sum no job de lint
      - run: go mod tidy

      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ env.SERVICE_DIR }}
          args: --timeout=5m
          skip-cache: true

  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          exit-code: 1

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/develop'

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} ${{ env.SERVICE_DIR }}

      - name: Push to ECR
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

  update-gitops:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - run: git clone -b master https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/pcoutinhoo/togglemaster-gitops.git

      - run: |
          cd togglemaster-gitops

          sed -i "s|evaluation-service:.*|evaluation-service:${{ needs.build-and-push.outputs.image_tag }}|g" k8s/evaluation-service.yaml

          git config user.email "ci@togglemaster.com"
          git config user.name "GitHub Actions CI"

          git add k8s/evaluation-service.yaml

          git commit \
            -m "ci: atualiza evaluation-service para tag ${{ needs.build-and-push.outputs.image_tag }}" \
            || echo "sem mudancas"

          git push