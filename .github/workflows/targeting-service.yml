name: targeting-service CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-service.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-service.yml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/targeting-service
  SERVICE_DIR: targeting-service

jobs:
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: flake8 . --max-line-length=120 --exit-zero

  security-sca:
    name: Security Scan - SCA (Trivy fs)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          exit-code: 1

  security-sast:
    name: Security Scan - SAST (bandit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - name: Run bandit (falha em severidade HIGH)
        run: bandit -r . -ll -iii

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security-sca, security-sast]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} ${{ env.SERVICE_DIR }}

      - name: Trivy image scan (container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          exit-code: 1

      - name: Push to ECR
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

  update-gitops:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - run: git clone -b develop https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/pcoutinhoo/togglemaster-gitops.git
      - run: |
          cd togglemaster-gitops
          sed -i "s|targeting-service:.*|targeting-service:${{ needs.build-and-push.outputs.image_tag }}|g" k8s/targeting-service.yaml
          git config user.email "ci@togglemaster.com"
          git config user.name "GitHub Actions CI"
          git add k8s/targeting-service.yaml
          git commit -m "ci: atualiza targeting-service para tag ${{ needs.build-and-push.outputs.image_tag }}" || echo "sem mudancas"
          git push